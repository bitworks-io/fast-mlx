name: Public source quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-source-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Run publication tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build and validate the site
        run: |
          python3 scripts/build_public_site.py --output "$RUNNER_TEMP/fast-mlx-site"
          python3 scripts/validate_public_site.py "$RUNNER_TEMP/fast-mlx-site"

      - name: Validate public checkout and regenerated boundary
        run: |
          python3 scripts/validate_public_repository.py .
          python3 scripts/export_public_repository.py \
            --output "$RUNNER_TEMP/fast-mlx-public"
          python3 scripts/validate_public_repository.py \
            "$RUNNER_TEMP/fast-mlx-public"

  # Runs this repository's own test suite: the 8 dependency-free targets, built and
  # EXECUTED, against the counts pinned in scripts/projected_test_expectations.json.
  # Building a suite is not running it, and until this job existed nothing here ran
  # the ~300 test files this repository ships.
  #
  # Deliberately one job and deliberately no --target: the expectations file is the
  # single source of truth for which targets are covered, so a target added there is
  # gated automatically instead of waiting for someone to remember to add its name to
  # a matrix here. Per-target attribution comes from the gate's own result table, and
  # each target's full raw output is uploaded as an artifact on success or failure.
  #
  # This job gates the `pages` deploy. The runner is Swift 6.3.3 (Xcode 26.6), where
  # the gate builds the whole package once with `swift build --build-tests` and runs
  # each target's classes from the one combined bundle that build produces. Promoted
  # after its first run on this runner showed 8/8 OK. It replaced a job that only
  # built three library targets; building the test targets builds those too.
  projected-test-suites:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      # Recorded deliberately: the gate's behaviour depends on this, so a refusal can
      # be attributed to the toolchain instead of guessed at.
      - name: Report Swift and Xcode toolchain
        run: |
          swift --version
          xcodebuild -version || true
          xcode-select -p
          ls -d /Applications/Xcode*.app || true

      # No pipe here, on purpose: piping into tee would report tee's exit status and
      # turn a failing suite into a green job.
      - name: Run the projected test suites against their pinned baseline
        run: |
          python3 scripts/run_projected_test_suites.py \
            --projection . \
            --log-dir "$RUNNER_TEMP/projected-test-logs"

      # The pinned-snapshot downloader and `fastmlx pull` publish with a macOS-only
      # exclusive rename, so those cases skip on the Linux job and run here. A skip
      # on macOS would mean they silently stopped running, so it fails the job.
      - name: Run the macOS-only acquisition tests
        run: |
          log="$RUNNER_TEMP/acquisition-tests.log"
          if ! python3 -B -m unittest scripts.tests.test_hf_pinned_snapshot_download scripts.tests.test_fastmlx_pull -v > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          cat "$log"
          if grep -q "skipped" "$log"; then
            echo "acquisition tests skipped on macOS" >&2
            exit 1
          fi

      - name: Upload per-target test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: projected-test-logs
          path: ${{ runner.temp }}/projected-test-logs
          if-no-files-found: warn
          retention-days: 14

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [public-boundary, projected-test-suites]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
